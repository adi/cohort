# cohort server configuration.
#
# Passed to tmux with -f, so cohort's private server (tmux -L cohort)
# never reads your ~/.tmux.conf. cohort wrote this file once; it now
# belongs to the cohort manager. Edit freely, then apply it live with
#   tmux -L cohort source-file @ROOT@/tmux.conf
# (some settings only take effect for windows created afterwards).

set -g default-terminal "tmux-256color"
set -s extended-keys on
set -as terminal-features ',xterm-256color:extkeys'
set -g history-limit 100000
set -g mouse on

# Copies (mouse selection or copy-mode) go to the terminal's clipboard
# via OSC 52, also over ssh.
set -g set-clipboard on
# Let escape sequences through to the outer terminal (e.g. iTerm2 tab
# colours). tmux 3.4 turned this off by default.
set -g allow-passthrough on

# Keep a window open (as a dead pane) when its command exits, so its
# output can be inspected. cohort does not restart dead agent panes
# (only the manager's); kill the window and cohort recreates it.
setw -g remain-on-exit on

# Window names are agent names: don't let programs or tmux rename them.
setw -g allow-rename off
setw -g automatic-rename off

# ---------------------------------------------------- previous/next window --
# Cmd+Left / Cmd+Right switch windows. macOS never puts the Command
# modifier on the wire, so iTerm2 has to send something for it
# (Settings -> Profiles -> Keys -> Key Mappings -> Send Escape Sequence,
# "[9001~" and "[9002~"). These CSI ... ~ codes are outside anything a
# real key produces, so plain arrows still reach the pane untouched.
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"
bind -n User0 previous-window
bind -n User1 next-window

# ----------------------------------------------------------------- colours --
# cohort gives every window a colour derived from its agent name, in
# the window options @cohort_color ("colourNNN") and @cohort_rgb
# ("R G B"). Styles are expanded against the current window, so the
# bar repaints itself in the current agent's colour.
set -g status-style "bg=#{?@cohort_color,#{@cohort_color},colour244},fg=colour232"
setw -g pane-active-border-style "fg=#{?@cohort_color,#{@cohort_color},colour244}"
setw -g pane-border-style "fg=colour238"
setw -g window-status-activity-style none

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left " #[bold]#S#[nobold] "
set -g status-left-length 24
set -g status-right "#[bold]#{b:pane_current_path}#[nobold]  #h  %H:%M "
set -g status-right-length 60

# The current window is marked by reversing the bar colours instead of
# tmux's "*". #{s/[-*]//:window_flags} drops "*" (redundant with the
# highlight) and "-" (last window) but keeps Z zoomed, # activity,
# ! bell, ~ silence and M marked.
setw -g window-status-separator ""
setw -g window-status-format " #I #W#{s/[-*]//:window_flags} "
setw -g window-status-current-format "#[reverse,bold] #I #W#{s/[-*]//:window_flags} #[noreverse,nobold]"

# The terminal title follows the current window: "agent@session".
set -g set-titles on
set -g set-titles-string "#W@#S"

# -------------------------------------------------------------- lock-down --
# Interactive operations that would wreck the layout cohort maintains
# are turned off. This only guards the keyboard and mouse: tmux has no
# permissions for its owner, so `tmux -L cohort <command>` from a shell
# still does anything (that's how the manager restarts agents).
#
# Restart a window deliberately instead of killing it: cohort recreates
# it within a second with its command from config.json.
bind R confirm-before -p "restart #W? cohort recreates it (y/n)" kill-window

# Kill keys.
bind & display-message "disabled in cohort: use prefix R to restart a window"
bind x display-message "disabled in cohort: use prefix R to restart a window"
# Session and layout keys: renaming Desktop/Background makes cohort
# build them again (a second manager); splitting, breaking or moving
# panes and windows leaves agents where cohort and its skills don't
# expect them.
bind '$' display-message "disabled in cohort: sessions are managed by cohort"
bind ! display-message "disabled in cohort: windows are managed by cohort"
bind '"' display-message "disabled in cohort: windows are managed by cohort"
bind % display-message "disabled in cohort: windows are managed by cohort"
bind . display-message "disabled in cohort: windows are managed by cohort"
# The command prompt would allow any of the above.
bind : display-message "disabled in cohort: use tmux -L cohort <command> from a shell"
# Menus with Kill / Split / Break entries: the window and pane menus
# (prefix < and >, right-click on the status bar, Alt+right-click on a
# pane). Right-click in a pane still reaches programs that use the
# mouse.
# The window and session lists (prefix w, s) have built-in kill keys
# (x, X) that can't be turned off on their own.
bind w display-message "disabled in cohort"
bind s display-message "disabled in cohort"
bind < display-message "disabled in cohort"
bind > display-message "disabled in cohort"
unbind -n MouseDown3Status
unbind -n M-MouseDown3Status
unbind -n M-MouseDown3Pane
bind -n MouseDown3Pane if -F -t = "#{mouse_any_flag}" { select-pane -t = ; send-keys -M } { select-pane -t = }

# ------------------------------------------------------- iTerm2 tab colour --
# The iTerm2 tab takes the current window's colour. On attach, tmux
# copies LC_TERMINAL / TERM_PROGRAM from the attaching terminal into
# the session, which is how tab-color.sh knows iTerm2 is there (also
# over ssh). Other terminals get nothing.
set -ga update-environment " LC_TERMINAL TERM_PROGRAM"
set-hook -g session-window-changed 'run-shell -b "@ROOT@/tab-color.sh #{q:session_id}"'
set-hook -g client-attached 'run-shell -b "@ROOT@/tab-color.sh #{q:session_id}"'
set-hook -g client-session-changed 'run-shell -b "@ROOT@/tab-color.sh #{q:session_id}"'
