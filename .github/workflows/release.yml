name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # test and build without publishing

permissions:
  contents: write

jobs:
  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: brew install tmux
      - run: go vet ./... && go test ./...

  release:
    needs: test-macos
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no dependencies (no go.sum) to cache
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          mkdir dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
                -o dist/cohort-$os-$arch .
            done
          done
          cp install.sh contrib/cohort.service contrib/cohort.plist dist/
          (cd dist && sha256sum * > ../SHA256SUMS && mv ../SHA256SUMS .)
      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
